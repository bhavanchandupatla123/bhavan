  </g>
  <rect x="76" y="306" width="660" height="310" rx="16" fill="#17263b"/>
  <text x="100" y="342" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="18" font-weight="700">Sales Trend</text>
  <line x1="112" y1="560" x2="700" y2="560" stroke="#31455a"/>
  <line x1="112" y1="380" x2="112" y2="560" stroke="#31455a"/>
  <polyline points="112,520 185,480 260,500 335,430 410,455 485,400 560,420 635,360 700,385" fill="none" stroke="#54d2d2" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="635" cy="360" r="8" fill="#7dd3fc"/>
